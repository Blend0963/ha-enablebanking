# Tableau de bord "Ma banque" pour l'intégration Enable Banking (0.10.0+).
# Généré par scripts/generate_dashboard.py.
#
# Cartes nécessaires (HACS > Dashboard) : Mushroom, ApexCharts Card.
# Intégration nécessaire pour le détail d'une catégorie au clic : Browser Mod.
#
# Remplace les 4 entités ci-dessous si elles sont encore en majuscules :
#   sensor.SOLDE_BNP / sensor.SOLDE_HELLO               -> capteurs de solde (IBAN)
#   sensor.TRANSACTIONS_BNP / sensor.TRANSACTIONS_HELLO -> capteurs "Transactions …"
#
title: Ma banque
views:
- title: Ma banque
  path: banque
  icon: mdi:bank
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Mes comptes
      icon: mdi:wallet-outline
    - &id003
      type: custom:mushroom-template-card
      entity: sensor.bnp_paribas_solde_total
      primary: '{% set t = states(entity)|float(0) %}{{ ''{:,.2f}''.format(t).replace('','', '' '').replace(''.'', '','') }} €'
      secondary: '{% set n = state_attr(entity, ''overdrawn_accounts'')|int(0) %}Solde total · {{ ''à découvert'' if states(entity)|float(0) < 0 else ''créditeur'' }}{% if n %} · {{ n }} compte{{ ''s'' if n > 1 }} à découvert{% endif %}'
      icon: '{{ ''mdi:alert-circle-outline'' if states(entity)|float(0) < 0 else ''mdi:piggy-bank-outline'' }}'
      icon_color: '{{ ''red'' if states(entity)|float(0) < 0 else ''green'' }}'
      tap_action:
        action: more-info
      layout: horizontal
      fill_container: true
      grid_options:
        columns: full
    - &id004
      type: custom:mushroom-template-card
      entity: sensor.SOLDE_BNP
      primary: BNP Paribas
      secondary: '{% set b = states(''sensor.SOLDE_BNP'')|float(0) %}{{ ''%.2f''|format(b)|replace(''.'', '','') }} €{% if b < 0 %} · À DÉCOUVERT{% endif %} · {{ state_attr(''sensor.TRANSACTIONS_BNP'', ''month_spent'')|float(0)|round(0)|int }} € ce mois'
      icon: mdi:bank
      icon_color: '{{ ''red'' if states(''sensor.SOLDE_BNP'')|float(0) < 0 else ''green'' }}'
      multiline_secondary: true
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - &id005
      type: custom:mushroom-template-card
      entity: sensor.SOLDE_HELLO
      primary: Hello bank!
      secondary: '{% set b = states(''sensor.SOLDE_HELLO'')|float(0) %}{{ ''%.2f''|format(b)|replace(''.'', '','') }} €{% if b < 0 %} · À DÉCOUVERT{% endif %} · {{ state_attr(''sensor.TRANSACTIONS_HELLO'', ''month_spent'')|float(0)|round(0)|int }} € ce mois'
      icon: mdi:bank-outline
      icon_color: '{{ ''red'' if states(''sensor.SOLDE_HELLO'')|float(0) < 0 else ''light-blue'' }}'
      multiline_secondary: true
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      primary: Dépenses
      icon: mdi:chart-donut
      icon_color: red
      layout: vertical
      tap_action:
        action: navigate
        navigation_path: depenses
      grid_options:
        columns: 3
    - type: custom:mushroom-template-card
      primary: Budgets
      icon: mdi:target
      icon_color: orange
      layout: vertical
      tap_action:
        action: navigate
        navigation_path: budgets
      grid_options:
        columns: 3
    - type: custom:mushroom-template-card
      primary: Comptes
      icon: mdi:bank
      icon_color: green
      layout: vertical
      tap_action:
        action: navigate
        navigation_path: comptes
      grid_options:
        columns: 3
    - type: custom:mushroom-template-card
      primary: Opérations
      icon: mdi:receipt-text-outline
      icon_color: blue
      layout: vertical
      tap_action:
        action: navigate
        navigation_path: operations
      grid_options:
        columns: 3
  - type: grid
    cards:
    - type: heading
      heading: Ce mois-ci
      icon: mdi:calendar-month-outline
    - type: custom:mushroom-template-card
      entity: sensor.bnp_paribas_depenses_totales_du_mois
      primary: '{{ states(entity)|float(0)|round(0)|int }} €'
      secondary: '{% set n = states(entity)|float(0) %}{% set p = state_attr(entity, ''previous_month'')|float(0) %}Dépenses{% if p > 0 %} · {{ ''%+d''|format(((n - p) / p * 100)|round(0)|int) }} % vs mois dernier{% endif %}'
      icon: mdi:arrow-top-right-thin-circle-outline
      icon_color: red
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      entity: sensor.bnp_paribas_revenus_du_mois
      primary: '{{ states(entity)|float(0)|round(0)|int }} €'
      secondary: Revenus
      icon: mdi:arrow-bottom-left-thin-circle-outline
      icon_color: green
      tap_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-template-card
      primary: '{% set s = states(''sensor.bnp_paribas_revenus_du_mois'')|float(0) - states(''sensor.bnp_paribas_depenses_totales_du_mois'')|float(0) %}{{ ''%+d''|format(s|round(0)|int) }} €'
      secondary: Épargne du mois (revenus − dépenses)
      icon: mdi:scale-balance
      icon_color: '{% set s = states(''sensor.bnp_paribas_revenus_du_mois'')|float(0) - states(''sensor.bnp_paribas_depenses_totales_du_mois'')|float(0) %}{{ ''green'' if s >= 0 else ''orange'' }}'
      grid_options:
        columns: full
    - type: custom:mushroom-template-card
      entity: sensor.bnp_paribas_budgets_depasses
      primary: '{% set r = state_attr(entity, ''total_budget'')|float(0) - state_attr(entity, ''total_spent_budgeted'')|float(0) %}{% if state_attr(entity, ''total_budget'')|float(0) == 0 %}Aucun budget{% elif r >= 0 %}Il te reste {{ r|round(0)|int }} €{% else %}Budget dépassé de {{ (r|abs)|round(0)|int }} €{% endif %}'
      secondary: '{% set b = state_attr(entity, ''total_budget'')|float(0) %}{% set d = state_attr(entity, ''total_spent_budgeted'')|float(0) %}{% if b %}{{ d|round(0)|int }} € dépensés sur {{ b|round(0)|int }} €{% if states(entity)|int(0) %} · {{ states(entity) }} catégorie(s) dépassée(s){% endif %}{% else %}Touche pour définir tes budgets{% endif %}'
      icon: mdi:target
      icon_color: '{% set r = state_attr(entity, ''total_budget'')|float(0) - state_attr(entity, ''total_spent_budgeted'')|float(0) %}{{ ''red'' if r < 0 else (''orange'' if states(entity)|int(0) else ''green'') }}'
      tap_action:
        action: navigate
        navigation_path: budgets
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Dernières opérations
      icon: mdi:format-list-bulleted
    - type: markdown
      content: |-
        | | Opération | Montant |
        |:--|:--|--:|
        {% for t in (state_attr('sensor.bnp_paribas_depenses_totales_du_mois', 'recent_transactions') or [])[:6] %}| <ha-icon icon="{{ t.icon }}"></ha-icon> | **{{ t.merchant[:28]|trim }}**<br><sub>{% if t.date %}{{ t.date[8:10] }}/{{ t.date[5:7] }} · {% endif %}{{ t.category_name }} · {{ t.account }}{% if t.pending %} · en attente{% endif %}</sub> | {{ '%+.2f'|format(t.amount)|replace('.', ',') }} € |
        {% endfor %}

        [Toutes les opérations →](operations)
      card_mod: &id002
        style:
          ha-markdown$: 'table { width: 100%; border-collapse: collapse; }

            th, td { padding: 8px 10px; }

            tr { border-bottom: 1px solid var(--divider-color); }

            td:last-child, th:last-child { text-align: right; }

            '
- title: Dépenses
  path: depenses
  icon: mdi:chart-donut
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Répartition
      icon: mdi:chart-donut
    - type: custom:apexcharts-card
      chart_type: donut
      header:
        show: true
        title: Répartition des dépenses
        show_states: false
      apex_config:
        chart:
          height: 320
        legend:
          position: bottom
          fontSize: 12px
        dataLabels:
          enabled: false
        plotOptions:
          pie:
            donut:
              size: 70%
              labels:
                show: true
                total:
                  show: true
                  label: Total
                  formatter: EVAL:function(w){return Math.round(w.globals.seriesTotals.reduce((a,b)=>a+b,0))+' €'}
                value:
                  formatter: EVAL:function(v){return Math.round(v)+' €'}
      all_series_config:
        transform: return Math.max(Number(x) || 0, 0);
      series:
      - entity: sensor.bnp_paribas_depenses_courses
        name: Courses
        color: '#F5A524'
      - entity: sensor.bnp_paribas_depenses_restaurants_et_cafes
