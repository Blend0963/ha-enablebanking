        | Date de comptabilisation | {{ bd[8:10] }}/{{ bd[5:7] }}/{{ bd[0:4] }} |
        | Statut | {{ 'En attente' if state_attr(e, 'pending') else 'Comptabilisée' }} |
        | Position | {{ state_attr(e, 'position') }} / {{ state_attr(e, 'total') }} |

        **Libellé exact**
        ```
