        color: '#E5484D'
      - entity: sensor.bnp_paribas_depenses_transport
        name: Transport
        color: '#3E63DD'
      - entity: sensor.bnp_paribas_depenses_logement_et_energie
        name: Logement
        color: '#8E4EC6'
      - entity: sensor.bnp_paribas_depenses_abonnements_et_tech
        name: Abonnements
        color: '#00A2C7'
      - entity: sensor.bnp_paribas_depenses_shopping
        name: Shopping
        color: '#D6409F'
      - entity: sensor.bnp_paribas_depenses_sante
        name: Santé
        color: '#30A46C'
      - entity: sensor.bnp_paribas_depenses_loisirs_et_sorties
