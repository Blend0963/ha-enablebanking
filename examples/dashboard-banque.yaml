- title: Budgets
  path: budgets
  icon: mdi:target
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Budgets du mois
      icon: mdi:target
    - type: markdown
      content: |-
        {% set e = 'sensor.bnp_paribas_budgets_depasses' %}
        {% set rows = state_attr(e, 'budgets') or [] %}
        {% if not rows %}
        *Aucun budget défini. Renseigne un montant ci-dessous (0 = pas de budget).*
        {% else %}
        {% set tb = state_attr(e, 'total_budget')|float(0) %}
        {% set ts = state_attr(e, 'total_spent_budgeted')|float(0) %}
        {% set reste = tb - ts %}
        {% set fin = (now().replace(day=28) + timedelta(days=4)).replace(day=1) - timedelta(days=1) %}
        {% set jours = fin.day - now().day + 1 %}
        <center>

        {{ 'Il te reste' if reste >= 0 else 'Budget dépassé de' }}
        # {{ (reste|abs)|round(0)|int }} €
        Dépensé **{{ ts|round(0)|int }} €** sur {{ tb|round(0)|int }} €{% if reste > 0 %} · soit **{{ (reste / jours)|round(0)|int }} €/jour** jusqu'à la fin du mois{% endif %}

        </center>

        | Catégorie | Dépensé | Reste |
        |:--|--:|--:|
        {% for r in rows %}{% set left = r.budget - r.spent %}| {{ '🔴' if r.over else ('🟠' if r.used_pct >= 80 else '🟢') }} {{ r.category }} | {{ r.spent|round(0)|int }} € | {% if left >= 0 %}**{{ left|round(0)|int }} €**{% else %}**dépassé de {{ (left|abs)|round(0)|int }} €**{% endif %} |
        {% endfor %}
        {% endif %}
      card_mod: *id002
  - type: grid
    cards:
    - type: entities
      title: Définir les budgets
      show_header_toggle: false
      state_color: false
      entities:
      - entity: number.bnp_paribas_budget_courses
        name: Courses
      - entity: number.bnp_paribas_budget_restaurants_et_cafes
        name: Restaurants et cafés
      - entity: number.bnp_paribas_budget_transport
        name: Transport
      - entity: number.bnp_paribas_budget_logement_et_energie
        name: Logement et énergie
      - entity: number.bnp_paribas_budget_abonnements_et_tech
        name: Abonnements et tech
      - entity: number.bnp_paribas_budget_shopping
        name: Shopping
      - entity: number.bnp_paribas_budget_sante
        name: Santé
      - entity: number.bnp_paribas_budget_loisirs_et_sorties
        name: Loisirs et sorties
      - entity: number.bnp_paribas_budget_voyages
        name: Voyages
      - entity: number.bnp_paribas_budget_impots_et_administration
        name: Impôts et administration
      - entity: number.bnp_paribas_budget_especes
        name: Espèces
      - entity: number.bnp_paribas_budget_frais_bancaires
        name: Frais bancaires
      - entity: number.bnp_paribas_budget_virements_emis
        name: Virements émis
      - entity: number.bnp_paribas_budget_autre
        name: Autre
- title: Comptes
  path: comptes
  icon: mdi:bank
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Soldes
      icon: mdi:chart-areaspline
    - *id003
    - *id004
    - *id005
    - type: custom:apexcharts-card
      header:
        show: true
        title: Évolution des soldes (30 jours)
        show_states: false
      graph_span: 30d
      apex_config:
        chart:
          height: 230
        legend:
          position: top
        stroke:
          curve: smooth
        fill:
          type: gradient
          gradient:
            opacityFrom: 0.35
            opacityTo: 0.02
        yaxis:
          labels:
            formatter: EVAL:function(v){return Math.round(v)+' €'}
        tooltip:
          y:
            formatter: EVAL:function(v){return v.toFixed(2).replace('.',',')+' €'}
        annotations:
          yaxis:
          - y: 0
            borderColor: '#E5484D'
            strokeDashArray: 4
            label:
              text: Découvert
              position: left
              style:
                color: '#fff'
                background: '#E5484D'
      series:
      - entity: sensor.SOLDE_BNP
        name: BNP Paribas
        color: '#00915A'
        type: area
        stroke_width: 3
        group_by:
          func: last
          duration: 1d
      - entity: sensor.SOLDE_HELLO
        name: Hello bank!
        color: '#2D9CDB'
        type: area
        stroke_width: 3
        group_by:
          func: last
          duration: 1d
  - type: grid
    cards:
    - type: heading
      heading: Par compte
      icon: mdi:compare-horizontal
    - type: markdown
      content: |-
        {% for label, ent, color in [('BNP Paribas', 'sensor.TRANSACTIONS_BNP', '🟢'), ('Hello bank!', 'sensor.TRANSACTIONS_HELLO', '🔵')] %}
        {% set spent = state_attr(ent, 'month_spent')|float(0) %}
        {% set cats = state_attr(ent, 'by_category') or {} %}
        ### {{ color }} {{ label }}

        **{{ spent|round(0)|int }} €** dépensés · **{{ state_attr(ent, 'month_received')|float(0)|round(0)|int }} €** reçus

        | Catégorie | | Montant |
        |:--|:--|--:|
        {% for name, value in cats.items() %}{% set pct = (value / spent * 100) if spent > 0 else 0 %}| {{ name }} | {{ '▰' * ((pct / 10)|round(0)|int) }}{{ '▱' * (10 - (pct / 10)|round(0)|int) }} | {{ value|round(0)|int }} € |
        {% endfor %}

        {% endfor %}
      card_mod: *id002
