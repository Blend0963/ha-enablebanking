      icon: mdi:cart
      icon_color: '{% set b = state_attr(entity, ''budget'') %}{{ ''red'' if b and states(entity)|float(0) > b else ''amber'' }}'
      badge_icon: '{% set b = state_attr(entity, ''budget'') %}{{ ''mdi:alert'' if b and states(entity)|float(0) > b else '''' }}'
      badge_color: red
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.sequence
          data:
            sequence:
            - service: select.select_option
